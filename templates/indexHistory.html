<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloud Antivirus — Анализ файлов</title>
  <link rel="stylesheet" href="/static/index.css">
  <style>
    /* Модальное окно угроз — адаптивная ширина под путь к файлу */
    #threatsModalInner {
      /* Растягивается под содержимое, но не уже 340px и не шире 90vw */
      width: max-content;
      min-width: 340px;
      max-width: min(90vw, 720px);
      box-sizing: border-box;
    }
    #threatsModalFile {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      /* Длинные пути переносятся, не разрывая слова посередине кириллицы */
      word-break: break-all;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    #threatsModalList {
      overflow-y: auto;
      max-height: 340px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div id="homeBtn" class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2a5 5 0 00-4.9 4.07A4.5 4.5 0 005 11.5 4.5 4.5 0 009.5 16h7a3.5 3.5 0 00.5-6.99A5 5 0 0012 2z"/>
      </svg>
    </div>
    <div>
      <h1>CLOUD ANTIVIRUS</h1>
      <div style="font-size:12px;color:var(--muted)">Облачный анализ загружаемых файлов</div>
    </div>
  </div>

  <nav aria-label="Главная навигация">
    <button id="enterBtn" title="Enter (вход/регистрация)">Enter</button>
    <button id="replacementText" style="display: none;">Button is hidden!</button>
    <button id="exitBtn">Exit</button>
    <button id="historyBtn">History</button>
    <button id="priceBtn">Price</button>
    <button id="contactBtn">Contact</button>
  </nav>
</header>

<main class="card" role="main" aria-labelledby="mainTitle">
  <h2 id="mainTitle" class="hero-title">History Page</h2>
  
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <label for="dateFrom" style="font-size:14px;font-weight:600;color:var(--muted);">С</label>
      <input type="date" id="dateFrom" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;color:#0f172a;background:#fff;cursor:pointer;" />
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <label for="dateTo" style="font-size:14px;font-weight:600;color:var(--muted);">По</label>
      <input type="date" id="dateTo" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;color:#0f172a;background:#fff;cursor:pointer;" />
    </div>
    <button class="btn" id="selectBtn" style="white-space:nowrap;">Показать</button>
  </div>

  <div id="tableWrap">
    <table class="table" id="table" style="width:100%;border-collapse:collapse;">
      <thead>
        <tr>
          <th style="text-align:center;padding:10px 14px;border-bottom:2px solid #e5eaf3;font-size:13px;color:var(--muted);font-weight:600;">Filename</th>
          <th style="text-align:center;padding:10px 14px;border-bottom:2px solid #e5eaf3;font-size:13px;color:var(--muted);font-weight:600;">Size (KB)</th>
          <th style="text-align:center;padding:10px 14px;border-bottom:2px solid #e5eaf3;font-size:13px;color:var(--muted);font-weight:600;">Date</th>
          <th style="text-align:center;padding:10px 14px;border-bottom:2px solid #e5eaf3;font-size:13px;color:var(--muted);font-weight:600;">Threat-Counts</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="tableEmpty" style="display:none;text-align:center;padding:32px 20px;">
    <div style="font-size:36px;margin-bottom:12px;" id="tableEmptyIcon">🔍</div>
    <div style="font-size:15px;font-weight:600;color:#0b2540;margin-bottom:6px;" id="tableEmptyTitle"></div>
    <div style="font-size:13px;color:var(--muted);" id="tableEmptyHint"></div>
  </div>

  <div id="threatsModal" style="
    display:none; position:fixed; inset:0;
    background:rgba(2,6,23,0.45);
    z-index:1000; align-items:center; justify-content:center; padding:20px;
  ">
    <div id="threatsModalInner" style="
      background:#fff; border-radius:14px; padding:28px 28px 24px;
      box-shadow:0 20px 60px rgba(2,6,23,0.35);
      position:relative; display:flex; flex-direction:column;
    ">
      <button id="threatsModalClose" style="
        position:absolute; top:14px; right:16px;
        background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1;
      " aria-label="Закрыть">&times;</button>
      <h3 style="margin:0 0 16px;font-size:16px;font-weight:700;color:#0b2540;">Обнаруженные угрозы</h3>
      <div id="threatsModalFile"></div>
      <div id="threatsModalList"></div>
    </div>
  </div>
</main>

<script>
  const enterBtn   = document.getElementById('enterBtn');
  const exitBtn    = document.getElementById('exitBtn');
  const homeBtn    = document.getElementById('homeBtn');
  const historyBtn = document.getElementById('historyBtn');
  const selectBtn  = document.getElementById('selectBtn');
  const replaceTxt = document.getElementById('replacementText');

  const threatsModal      = document.getElementById('threatsModal');
  const threatsModalClose = document.getElementById('threatsModalClose');
  const threatsModalFile  = document.getElementById('threatsModalFile');
  const threatsModalList  = document.getElementById('threatsModalList');

  function openThreatsModal(filename, threats) {
    threatsModalFile.textContent = 'Файл: ' + filename;
    threatsModalList.innerHTML = '';
    threats.forEach(t => {
      const el = document.createElement('div');
      el.style.cssText = 'background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;';
      el.textContent = t;
      threatsModalList.appendChild(el);
    });
    threatsModal.style.display = 'flex';
  }

  threatsModalClose.addEventListener('click', () => { threatsModal.style.display = 'none'; });
  threatsModal.addEventListener('click', e => {
    if (e.target === threatsModal) threatsModal.style.display = 'none';
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') threatsModal.style.display = 'none';
  });

  function toInputDate(d) {
    const y  = d.getFullYear();
    const m  = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }

  const today = new Date();
  const twoDaysAgo = new Date(today);
  twoDaysAgo.setDate(today.getDate() - 2);

  document.getElementById('dateTo').value   = toInputDate(today);
  document.getElementById('dateFrom').value = toInputDate(twoDaysAgo);

  // Показывает блок «нет данных» используя message/hint от сервера.
  // Иконка подбирается по status, полученному от Go-хендлера.
  function showEmptyState(status, message, hint) {
    const wrap  = document.getElementById('tableWrap');
    const empty = document.getElementById('tableEmpty');
    const icon  = document.getElementById('tableEmptyIcon');
    const title = document.getElementById('tableEmptyTitle');
    const hintEl = document.getElementById('tableEmptyHint');

    wrap.style.display  = 'none';
    empty.style.display = '';

    const icons = {
      'future':      '📅',
      'no_data_yet': '🕰️',
      'empty':       '🔍',
      'error':       '⚠️',
    };
    icon.textContent  = icons[status] || '🔍';
    title.textContent = message || 'Нет данных';
    hintEl.textContent = hint  || '';
  }

  function loadScanFiles(from, to) {
    const params = new URLSearchParams();
    if (from) params.set('from', from);
    if (to)   params.set('to', to);

    fetch('/api/scanfiles?' + params.toString())
      .then(r => {
        if (r.status === 401) { window.location.href = '/'; return null; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(resp => {
        if (!resp) return;

        // Сервер всегда возвращает { status, message, hint, files, total_scans, total_threats }
        // Анализ периода выполнен на стороне Go — клиент только отображает результат.
        if (resp.status !== 'ok') {
          showEmptyState(resp.status, resp.message, resp.hint);
          return;
        }

        const tbody    = document.querySelector('#table tbody');
        const tableWrap = document.getElementById('tableWrap');
        const empty    = document.getElementById('tableEmpty');
        tbody.innerHTML = '';
        tableWrap.style.display = '';
        empty.style.display = 'none';

        resp.files.forEach(file => {
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid #f1f5f9';

          const threats = parseInt(file.threats_count, 10) || 0;
          const threatsList = Array.isArray(file.threats_list) ? file.threats_list : [];

          let threatCell;
          if (threats === 0) {
            threatCell = '<span style="color:var(--success);font-weight:600;">0</span>';
          } else {
            threatCell = `<span
              class="threat-badge"
              data-filename="${file.filename.replace(/"/g, '&quot;')}"
              data-threats='${JSON.stringify(threatsList)}'
              style="display:inline-block;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;
                     border-radius:6px;padding:2px 10px;font-weight:600;font-size:13px;
                     cursor:pointer;transition:background 0.15s;"
              title="Нажмите, чтобы увидеть список угроз"
            >${threats}</span>`;
          }

          tr.innerHTML = `
            <td style="padding:10px 14px;font-size:14px;text-align:center;">${file.filename}</td>
            <td style="padding:10px 14px;font-size:14px;text-align:center;">${parseFloat(file.size).toFixed(1)}</td>
            <td style="padding:10px 14px;font-size:14px;text-align:center;">${file.date}</td>
            <td style="padding:10px 14px;text-align:center;">${threatCell}</td>
          `;
          tbody.appendChild(tr);
        });

        tbody.querySelectorAll('.threat-badge').forEach(badge => {
          badge.addEventListener('mouseenter', () => { badge.style.background = '#fee2e2'; });
          badge.addEventListener('mouseleave', () => { badge.style.background = '#fef2f2'; });
          badge.addEventListener('click', () => {
            const filename = badge.dataset.filename;
            let tList = [];
            try { tList = JSON.parse(badge.dataset.threats); } catch(e) {}
            if (tList.length === 0) tList = ['Список угроз недоступен (старая запись)'];
            openThreatsModal(filename, tList);
          });
        });
      })
      .catch(err => {
        console.error('Error loading scan files:', err);
        showEmptyState('error', 'Не удалось загрузить данные', 'Проверьте соединение или попробуйте позже');
      });
  }

  document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/check-auth')
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) {
          replaceTxt.style.display = 'inline';
          replaceTxt.textContent   = data.email;
          enterBtn.style.display   = 'none';
          exitBtn.style.display    = 'inline';
        } else {
          replaceTxt.style.display = 'none';
          enterBtn.style.display   = '';
          exitBtn.style.display    = 'none';
        }
      })
      .catch(() => {});

    loadScanFiles(
      document.getElementById('dateFrom').value,
      document.getElementById('dateTo').value
    );
  });

  selectBtn.addEventListener('click', () => {
    loadScanFiles(
      document.getElementById('dateFrom').value,
      document.getElementById('dateTo').value
    );
  });

  homeBtn.addEventListener('click',    () => { window.location.href = '/'; });
  historyBtn.addEventListener('click', () => { window.location.href = '/history'; });

  exitBtn.addEventListener('click', () => {
    if (confirm('Вы уверены, что хотите выйти?')) {
      fetch('/logout', { method: 'POST', credentials: 'same-origin' })
        .then(r => { if (r.ok) window.location.href = '/'; })
        .catch(() => {});
    }
  });
</script>

</body>
</html>
