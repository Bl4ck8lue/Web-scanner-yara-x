<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloud Antivirus — Администрирование</title>
  <link rel="stylesheet" href="/static/index.css">
  <style>
    .mode-tabs {
      display: flex;
      gap: 0;
      border: 1px solid rgba(43,123,228,0.2);
      border-radius: 10px;
      overflow: hidden;
      width: fit-content;
      margin: 0 auto 28px;
    }
    .mode-tab {
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #f1f6ff;
      color: var(--muted);
      border: none;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }
    .mode-tab.active { background: var(--primary); color: #fff; }
    .mode-tab:not(:last-child) { border-right: 1px solid rgba(43,123,228,0.2); }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .editor-toolbar select {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      background: #fff;
      cursor: pointer;
      min-width: 200px;
    }
    #ruleEditor {
      width: 100%;
      min-height: 380px;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-family: 'Courier New', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      color: #0f172a;
      background: #f8faff;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    #ruleEditor:focus { outline: none; border-color: var(--primary); background: #fff; }

    .file-path-box {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 13px;
      color: #166534;
      word-break: break-all;
    }
    .file-path-box.error { background: #fef2f2; border-color: #fecaca; color: #dc2626; }

    .upload-zone {
      border: 2px dashed rgba(43,123,228,0.25);
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      background: #f8faff;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: #eff6ff; }
    .upload-zone .upload-icon { font-size: 40px; margin-bottom: 10px; }
    .upload-zone .upload-hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .upload-zone .upload-name { font-size: 14px; font-weight: 600; color: #0f172a; margin-top: 8px; }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div id="homeBtn" class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2a5 5 0 00-4.9 4.07A4.5 4.5 0 005 11.5 4.5 4.5 0 009.5 16h7a3.5 3.5 0 00.5-6.99A5 5 0 0012 2z"/>
      </svg>
    </div>
    <div>
      <h1>CLOUD ANTIVIRUS</h1>
      <div style="font-size:12px;color:var(--muted)">Облачный анализ загружаемых файлов</div>
    </div>
  </div>

  <nav aria-label="Главная навигация">
    <button id="enterBtn" title="Enter (вход/регистрация)">Enter</button>
    <button id="replacementText" style="display:none;">Button is hidden!</button>
    <button id="exitBtn" style="display:none;">Exit</button>
    <button id="historyBtn">History</button>
    <button id="chooseBtn">Choose rules</button>
  </nav>
</header>

<main class="card" role="main" aria-labelledby="mainTitle">
  <h2 id="mainTitle" class="hero-title">Administration</h2>

  <div class="mode-tabs" role="tablist">
    <button class="mode-tab active" data-mode="edit" role="tab" aria-selected="true">
      Редактировать правило
    </button>
    <button class="mode-tab" data-mode="upload" role="tab" aria-selected="false">
      Загрузить новое
    </button>
    <button class="mode-tab" data-mode="download" role="tab" aria-selected="false">
      Скачать новые правила
    </button>
  </div>

  <!-- Режим 1: редактирование -->
  <div class="mode-panel active" id="panel-edit">
    <div class="editor-toolbar">
      <select id="ruleSelect">
        <option value="">— Выберите файл правил —</option>
      </select>
      <button class="btn secondary" id="loadRuleBtn" disabled>Открыть</button>
    </div>

    <textarea id="ruleEditor" placeholder="Выберите файл и нажмите «Открыть» для редактирования..." disabled></textarea>

    <div id="editPathBox" class="file-path-box"></div>

    <div class="action-row">
      <button class="btn" id="saveRuleBtn" disabled>Сохранить изменения</button>
      <button class="btn secondary" id="discardBtn" disabled>Отменить</button>
      <button class="btn secondary" id="clearEditorBtn" disabled>Очистить поле</button>
    </div>
  </div>

  <!-- Режим 2: загрузка -->
  <div class="mode-panel" id="panel-upload">
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon"></div>
      <div style="font-size:15px;font-weight:600;color:#0b2540;">Перетащите файл сюда</div>
      <div class="upload-hint">или нажмите для выбора файла</div>
      <div class="upload-name" id="uploadFileName" style="display:none;"></div>
      <input type="file" id="fileInput" style="display:none;" accept=".yara,.yar,.rule,.txt" />
    </div>

    <div id="uploadPathBox" class="file-path-box"></div>

    <div class="action-row">
      <button class="btn" id="uploadBtn" disabled>Загрузить на сервер</button>
      <button class="btn secondary" id="clearUploadBtn">Очистить</button>
    </div>
  </div>

  <!-- Режим 3: скачать новые правила -->
  <div class="mode-panel" id="panel-download">
    <div style="text-align:center;padding:32px 20px 16px;">
      <div style="font-size:48px;margin-bottom:16px;">⬇️</div>
      <button class="btn" id="downloadRulesBtn">Запустить скачивание</button>
    </div>

    <!-- Модальное окно результата -->
    <div id="downloadModal" style="
      display:none; position:fixed; inset:0;
      background:rgba(2,6,23,0.45);
      z-index:1000; align-items:center; justify-content:center; padding:20px;
    ">
      <div style="
        background:#fff; border-radius:16px; padding:36px 32px 28px;
        max-width:460px; width:100%;
        box-shadow:0 24px 64px rgba(2,6,23,0.3);
        position:relative; text-align:center;
      ">
        <div id="downloadModalIcon" style="font-size:52px;margin-bottom:16px;"></div>
        <h3 id="downloadModalTitle" style="margin:0 0 12px;font-size:18px;font-weight:700;color:#0b2540;"></h3>
        <p id="downloadModalMsg" style="margin:0 0 24px;font-size:14px;color:var(--muted);line-height:1.6;"></p>
        <pre id="downloadModalLog" style="
          display:none; text-align:left; font-size:12px;
          background:#f8faff; border:1px solid #e5eaf3; border-radius:8px;
          padding:12px; overflow-x:auto; margin:0 0 20px;
          color:#dc2626; max-height:160px; overflow-y:auto;
        "></pre>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="btn" id="downloadModalGoBtn" style="display:none;">Выбрать правила →</button>
          <button class="btn secondary" id="downloadModalCloseBtn">Закрыть</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;transition:opacity 0.3s;"></div>

<script>
const enterBtn       = document.getElementById('enterBtn');
const exitBtn        = document.getElementById('exitBtn');
const homeBtn        = document.getElementById('homeBtn');
const historyBtn     = document.getElementById('historyBtn');
const chooseBtn      = document.getElementById('chooseBtn');
const replaceTxt     = document.getElementById('replacementText');
const ruleSelect     = document.getElementById('ruleSelect');
const loadRuleBtn    = document.getElementById('loadRuleBtn');
const ruleEditor     = document.getElementById('ruleEditor');
const saveRuleBtn    = document.getElementById('saveRuleBtn');
const discardBtn     = document.getElementById('discardBtn');
const editPathBox    = document.getElementById('editPathBox');
const uploadZone     = document.getElementById('uploadZone');
const fileInput      = document.getElementById('fileInput');
const uploadFileName = document.getElementById('uploadFileName');
const uploadBtn      = document.getElementById('uploadBtn');
const clearUploadBtn = document.getElementById('clearUploadBtn');
const uploadPathBox  = document.getElementById('uploadPathBox');

let originalContent = '';

function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block'; t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => { t.style.display = 'none'; }, 300); }, duration);
}

function updateAuthUI(isAuth, email = '') {
  if (isAuth) {
    enterBtn.style.display  = 'none';
    replaceTxt.style.display = 'inline'; replaceTxt.textContent = email;
    exitBtn.style.display   = 'inline';
  } else {
    enterBtn.style.display  = '';
    replaceTxt.style.display = 'none';
    exitBtn.style.display   = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  fetch('/api/check-auth').then(r => r.json()).then(data => {
    updateAuthUI(data.authenticated, data.email);
    if (data.authenticated) loadRulesList();
  }).catch(() => updateAuthUI(false));
});

exitBtn.addEventListener('click', () => {
  if (confirm('Вы уверены, что хотите выйти?')) {
    fetch('/logout', { method: 'POST', credentials: 'same-origin' })
      .then(r => { if (r.ok) { updateAuthUI(false); window.location.href = '/'; } })
      .catch(() => showToast('Ошибка при выходе'));
  }
});

homeBtn.addEventListener('click',    () => window.location.href = '/');
historyBtn.addEventListener('click', () => window.location.href = '/history');
chooseBtn.addEventListener('click',  () => window.location.href = '/chooseRules');

// Mode tabs
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
    const mode = tab.dataset.mode;
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + mode).classList.add('active');
  });
});

// Edit mode
function loadRulesList() {
  fetch('/api/list-rules').then(r => r.json()).then(files => {
    ruleSelect.innerHTML = '<option value="">— Выберите файл правил —</option>';
    (files || []).forEach(name => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = name;
      ruleSelect.appendChild(opt);
    });
  }).catch(() => showToast('Не удалось загрузить список правил'));
}

ruleSelect.addEventListener('change', () => { loadRuleBtn.disabled = !ruleSelect.value; });

loadRuleBtn.addEventListener('click', () => {
  const name = ruleSelect.value;
  if (!name) return;
  loadRuleBtn.textContent = 'Загрузка…';
  loadRuleBtn.disabled = true;
  editPathBox.style.display = 'none';

  fetch('/api/rule-content?name=' + encodeURIComponent(name))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      originalContent = data.content;
      ruleEditor.value = data.content;
      ruleEditor.disabled = false;
      saveRuleBtn.disabled = false;
      discardBtn.disabled = false;
      document.getElementById('clearEditorBtn').disabled = false;
      editPathBox.textContent = 'Путь: ' + data.path;
      editPathBox.className = 'file-path-box';
      editPathBox.style.display = 'block';
      showToast('Файл «' + name + '» открыт');
    })
    .catch(err => showToast('Ошибка загрузки: ' + err.message))
    .finally(() => { loadRuleBtn.textContent = 'Открыть'; loadRuleBtn.disabled = false; });
});

saveRuleBtn.addEventListener('click', () => {
  const name = ruleSelect.value;
  if (!name) return;
  saveRuleBtn.textContent = 'Сохранение…';
  saveRuleBtn.disabled = true;

  fetch('/api/save-rule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, content: ruleEditor.value }),
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      originalContent = ruleEditor.value;
      editPathBox.textContent = 'Сохранено: ' + data.path;
      editPathBox.className = 'file-path-box';
      editPathBox.style.display = 'block';
      showToast('Файл успешно сохранён');
    })
    .catch(err => {
      editPathBox.textContent = 'Ошибка: ' + err.message;
      editPathBox.className = 'file-path-box error';
      editPathBox.style.display = 'block';
      showToast('Ошибка: ' + err.message);
    })
    .finally(() => { saveRuleBtn.textContent = '💾 Сохранить изменения'; saveRuleBtn.disabled = false; });
});

discardBtn.addEventListener('click', () => {
  if (confirm('Отменить все изменения?')) { ruleEditor.value = originalContent; showToast('Изменения отменены'); }
});

// Upload mode
function setUploadFile(file) {
  uploadFileName.textContent = file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
  uploadFileName.style.display = 'block';
  uploadBtn.disabled = false;
  uploadPathBox.style.display = 'none';
}

uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files.length) setUploadFile(fileInput.files[0]); });

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) { const dt = new DataTransfer(); dt.items.add(file); fileInput.files = dt.files; setUploadFile(file); }
});

clearUploadBtn.addEventListener('click', () => {
  fileInput.value = '';
  uploadFileName.style.display = 'none';
  uploadFileName.textContent = '';
  uploadBtn.disabled = true;
  uploadPathBox.style.display = 'none';
});

uploadBtn.addEventListener('click', () => {
  const file = fileInput.files[0];
  if (!file) return;
  uploadBtn.textContent = 'Загрузка…';
  uploadBtn.disabled = true;

  const form = new FormData();
  form.append('file', file);

  fetch('/loadingRules', { method: 'POST', body: form })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      uploadPathBox.textContent = 'Файл загружен. Путь на сервере: ' + data.path;
      uploadPathBox.className = 'file-path-box';
      uploadPathBox.style.display = 'block';
      showToast('Файл «' + data.name + '» успешно загружен');
      loadRulesList();
    })
    .catch(err => {
      uploadPathBox.textContent = 'Ошибка загрузки: ' + err.message;
      uploadPathBox.className = 'file-path-box error';
      uploadPathBox.style.display = 'block';
      showToast('Ошибка: ' + err.message);
    })
    .finally(() => { uploadBtn.textContent = '⬆️ Загрузить на сервер'; uploadBtn.disabled = false; });
});

// ─── Download rules ───────────────────────────────────────────────────────────
const downloadModal      = document.getElementById('downloadModal');
const downloadModalIcon  = document.getElementById('downloadModalIcon');
const downloadModalTitle = document.getElementById('downloadModalTitle');
const downloadModalMsg   = document.getElementById('downloadModalMsg');
const downloadModalLog   = document.getElementById('downloadModalLog');
const downloadModalGoBtn = document.getElementById('downloadModalGoBtn');
const downloadModalClose = document.getElementById('downloadModalCloseBtn');

function openDownloadModal(ok, title, msg, log) {
  downloadModalIcon.textContent  = ok ? '✅' : '❌';
  downloadModalTitle.textContent = title;
  downloadModalMsg.textContent   = msg;
  if (log) {
    downloadModalLog.textContent  = log.trim();
    downloadModalLog.style.display = 'block';
  } else {
    downloadModalLog.style.display = 'none';
  }
  downloadModalGoBtn.style.display = ok ? 'inline-block' : 'none';
  downloadModal.style.display = 'flex';
}

downloadModalClose.addEventListener('click', () => { downloadModal.style.display = 'none'; });
downloadModal.addEventListener('click', e => { if (e.target === downloadModal) downloadModal.style.display = 'none'; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') downloadModal.style.display = 'none'; });

downloadModalGoBtn.addEventListener('click', () => { window.location.href = '/chooseRules'; });

document.getElementById('downloadRulesBtn').addEventListener('click', () => {
  const btn = document.getElementById('downloadRulesBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Скачивание…';

  fetch('/api/download-rules', { method: 'POST', credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        loadRulesList();
        openDownloadModal(
          true,
          'Правила скачаны',
          'Новый набор правил скачан. На следующей странице выберите необходимый файл с правилами.',
          null
        );
        showToast('Правила успешно загружены');
      } else {
        openDownloadModal(
          false,
          'Ошибка скачивания',
          'Ошибка при скачивании: ' + (data.error || 'неизвестная ошибка'),
          data.output || null
        );
        showToast('Ошибка скачивания правил');
      }
    })
    .catch(err => {
      openDownloadModal(false, 'Сетевая ошибка', err.message, null);
      showToast('Сетевая ошибка');
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '⬇️ Запустить скачивание';
    });
});

// ─── Clear editor field ───────────────────────────────────────────────────────
document.getElementById('clearEditorBtn').addEventListener('click', () => {
  if (ruleEditor.value && confirm('Очистить всё содержимое редактора?')) {
    ruleEditor.value = '';
    showToast('Поле редактора очищено');
  }
});
</script>

</body>
</html>
